<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Pribadi</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      height: 100vh;
    }

    .app {
      max-width: 700px;
      height: 100vh;
      margin: auto;
      background: white;
      display: flex;
      flex-direction: column;
    }

    #accessPage {
      padding: 30px 20px;
      margin: auto;
      width: 100%;
      max-width: 400px;
    }

    #accessPage h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    #accessPage input {
      width: 100%;
      margin-bottom: 10px;
    }

    #accessPage button {
      width: 100%;
      margin-top: 5px;
    }

    #status {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }

    #chatPage {
      display: none;
      flex-direction: column;
      height: 100%;
    }

    .header {
      padding: 15px;
      border-bottom: 1px solid #ddd;
      font-size: 18px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .room {
      font-size: 12px;
      color: #777;
      font-weight: normal;
      margin-top: 3px;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .message {
      margin-bottom: 10px;
      padding: 10px 14px;
      border-radius: 14px;
      max-width: 80%;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .mine {
      background: #111;
      color: white;
      margin-left: auto;
    }

    .other {
      background: #e9e9e9;
      color: #111;
      margin-right: auto;
    }

    .sender {
      font-size: 11px;
      opacity: 0.65;
      margin-bottom: 4px;
    }

    .input-area {
      display: flex;
      padding: 10px;
      border-top: 1px solid #ddd;
      gap: 8px;
    }

    .input-area input {
      flex: 1;
    }

    input {
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .leave {
      padding: 7px 10px;
      font-size: 12px;
      background: #d33;
    }
  </style>
</head>

<body>

<div class="app">

  <div id="accessPage">

    <h2>Chat Pribadi</h2>

    <input
      id="name"
      type="text"
      placeholder="Nama kamu"
      maxlength="30"
    >

    <input
      id="pin"
      type="password"
      placeholder="PIN ruang chat"
      maxlength="20"
    >

    <button onclick="enterChat()">
      Masuk Chat
    </button>

    <div id="status"></div>

  </div>


  <div id="chatPage">

    <div class="header">

      <div>
        <div>Chat Pribadi</div>
        <div class="room">Ruang berdua</div>
      </div>

      <button class="leave" onclick="leaveChat()">
        Keluar
      </button>

    </div>


    <div id="chat"></div>


    <div class="input-area">

      <input
        id="message"
        type="text"
        placeholder="Tulis pesan..."
        maxlength="2000"
        onkeydown="if(event.key === 'Enter') sendMessage()"
      >

      <button onclick="sendMessage()">
        Kirim
      </button>

    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://aymsvwvtyalewphcvvfb.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_cAkNxO3QBbR2HaKLJPV6BQ_Zme9TIhz";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let myName = "";


// GANTI PIN DI SINI
const CHAT_PIN = "1234";


// MASUK CHAT
function enterChat() {

  const name =
    document.getElementById("name").value.trim();

  const pin =
    document.getElementById("pin").value.trim();

  const status =
    document.getElementById("status");


  if (!name) {
    status.textContent = "Masukkan nama.";
    return;
  }


  if (pin !== CHAT_PIN) {
    status.textContent = "PIN salah.";
    return;
  }


  myName = name;

  document.getElementById("accessPage").style.display =
    "none";

  document.getElementById("chatPage").style.display =
    "flex";


  loadMessages();
  subscribeRealtime();
}


// KELUAR
function leaveChat() {

  myName = "";

  document.getElementById("chatPage").style.display =
    "none";

  document.getElementById("accessPage").style.display =
    "block";

  document.getElementById("chat").innerHTML = "";
}


// LOAD PESAN
async function loadMessages() {

  const chat =
    document.getElementById("chat");

  chat.innerHTML = "";


  const { data, error } =
    await supabaseClient
      .from("messages")
      .select("*")
      .order("created_at", {
        ascending: true
      });


  if (error) {

    chat.innerHTML =
      "<div>Gagal mengambil pesan: " +
      error.message +
      "</div>";

    console.error(error);

    return;
  }


  data.forEach(message => {

    displayMessage(message);

  });


  scrollBottom();
}


// TAMPILKAN PESAN
function displayMessage(message) {

  const chat =
    document.getElementById("chat");


  const box =
    document.createElement("div");


  box.className =
    "message " +
    (
      message.sender === myName
        ? "mine"
        : "other"
    );


  const sender =
    document.createElement("div");

  sender.className =
    "sender";

  sender.textContent =
    message.sender;


  const text =
    document.createElement("div");

  text.textContent =
    message.message;


  box.appendChild(sender);
  box.appendChild(text);

  chat.appendChild(box);
}


// KIRIM PESAN
async function sendMessage() {

  const input =
    document.getElementById("message");

  const text =
    input.value.trim();


  if (!text) return;

  if (!myName) return;


  input.value = "";


  const { error } =
    await supabaseClient
      .from("messages")
      .insert({
        sender: myName,
        message: text
      });


  if (error) {

    alert(
      "Pesan gagal dikirim: " +
      error.message
    );

    input.value = text;

    console.error(error);

  }

}


// REALTIME
function subscribeRealtime() {

  supabaseClient
    .channel("chat-room")
    .on(
      "postgres_changes",
      {
        event: "INSERT",
        schema: "public",
        table: "messages"
      },
      payload => {

        displayMessage(
          payload.new
        );

        scrollBottom();

      }
    )
    .subscribe();

}


// SCROLL
function scrollBottom() {

  const chat =
    document.getElementById("chat");

  chat.scrollTop =
    chat.scrollHeight;
}

</script>

</body>
</html>
