<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Pribadi</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      height: 100vh;
    }

    .app {
      max-width: 700px;
      height: 100vh;
      margin: auto;
      background: white;
      display: flex;
      flex-direction: column;
    }

    #accessPage {
      padding: 30px 20px;
      margin: auto;
      width: 100%;
      max-width: 400px;
    }

    #accessPage h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    input {
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    #accessPage input {
      width: 100%;
      margin-bottom: 10px;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #accessPage button {
      width: 100%;
    }

    #status {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }

    #chatPage {
      display: none;
      flex-direction: column;
      height: 100%;
    }

    .header {
      padding: 15px;
      border-bottom: 1px solid #ddd;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
    }

    .header small {
      display: block;
      color: #777;
      font-weight: normal;
      margin-top: 3px;
    }

    .header button {
      background: #d33;
      padding: 7px 10px;
      font-size: 12px;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .message {
      margin-bottom: 10px;
      padding: 10px 14px;
      border-radius: 14px;
      max-width: 80%;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .mine {
      background: #111;
      color: white;
      margin-left: auto;
    }

    .other {
      background: #e9e9e9;
      color: #111;
      margin-right: auto;
    }

    .input-area {
      display: flex;
      padding: 10px;
      border-top: 1px solid #ddd;
      gap: 8px;
    }

    .input-area input {
      flex: 1;
    }

    .call-area {
      display: none;
      position: relative;
      padding: 10px;
      background: #111;
    }

    #remoteVideo {
      width: 100%;
      max-height: 70vh;
      background: #000;
      border-radius: 12px;
      display: block;
    }

    #localVideo {
      position: absolute;
      width: 120px;
      right: 20px;
      top: 20px;
      background: #000;
      border-radius: 10px;
    }

    .call-buttons {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .call-buttons button {
      flex: 1;
    }

    .end-call {
      background: #d33;
    }

    #screenNotice {
      display: none;
      padding: 10px;
      background: #d33;
      color: white;
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="app">

  <!-- MASUK RUANG -->
  <div id="accessPage">

    <h2>Chat Pribadi</h2>

    <input
      id="pin"
      type="password"
      placeholder="Kode ruang"
      maxlength="30"
      onkeydown="if(event.key === 'Enter') enterChat()"
    >

    <button onclick="enterChat()">
      Masuk
    </button>

    <div id="status"></div>

  </div>


  <!-- CHAT -->
  <div id="chatPage">

    <div class="header">

      <div>
        Chat Pribadi
        <small>Ruang privat</small>
      </div>

      <button onclick="leaveChat()">
        Keluar
      </button>

    </div>


    <!-- VIDEO CALL -->
    <div id="callArea">

      <div id="screenNotice">
        ⚠️ Aktivitas berbagi layar terdeteksi.
      </div>

      <video
        id="remoteVideo"
        autoplay
        playsinline
      ></video>

      <video
        id="localVideo"
        autoplay
        muted
        playsinline
      ></video>

      <div class="call-buttons">

        <button onclick="toggleMic()">
          Mic
        </button>

        <button onclick="toggleCamera()">
          Kamera
        </button>

        <button
          class="end-call"
          onclick="endCall()"
        >
          Tutup
        </button>

      </div>

    </div>


    <div id="chat"></div>


    <div class="input-area">

      <input
        id="message"
        type="text"
        placeholder="Tulis pesan..."
        maxlength="2000"
        onkeydown="if(event.key === 'Enter') sendMessage()"
      >

      <button onclick="sendMessage()">
        Kirim
      </button>

    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://aymsvwvtyalewphcvvfb.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_cAkNxO3QBbR2HaKLJPV6BQ_Zme9TIhz";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


// ===============================
// PENGATURAN
// ===============================

const CHAT_PIN = "1234";

let myId = "";

let chatChannel = null;

let callChannel = null;

let peerConnection = null;

let localStream = null;


// ===============================
// MASUK
// ===============================

function enterChat() {

  const pin =
    document.getElementById("pin").value.trim();

  const status =
    document.getElementById("status");


  if (!pin) {

    status.textContent =
      "Masukkan kode ruang.";

    return;

  }


  if (pin !== CHAT_PIN) {

    status.textContent =
      "Kode ruang salah.";

    return;

  }


  // ID otomatis
  myId =
    localStorage.getItem("chat_user_id");


  if (!myId) {

    myId =
      crypto.randomUUID();

    localStorage.setItem(
      "chat_user_id",
      myId
    );

  }


  document.getElementById("accessPage").style.display =
    "none";

  document.getElementById("chatPage").style.display =
    "flex";


  loadMessages();

  subscribeChat();

}


// ===============================
// KELUAR
// ===============================

function leaveChat() {

  endCall();


  if (chatChannel) {

    supabaseClient.removeChannel(
      chatChannel
    );

    chatChannel = null;

  }


  myId = "";


  document.getElementById("chatPage").style.display =
    "none";

  document.getElementById("accessPage").style.display =
    "block";

  document.getElementById("pin").value =
    "";

  document.getElementById("chat").innerHTML =
    "";

}


// ===============================
// LOAD PESAN
// ===============================

async function loadMessages() {

  const chat =
    document.getElementById("chat");


  chat.innerHTML = "";


  const { data, error } =
    await supabaseClient
      .from("messages")
      .select("*")
      .order("created_at", {
        ascending: true
      });


  if (error) {

    chat.innerHTML =
      "Gagal mengambil pesan: " +
      error.message;

    return;

  }


  data.forEach(
    displayMessage
  );


  scrollBottom();

}


// ===============================
// TAMPILKAN PESAN
// ===============================

function displayMessage(message) {

  const chat =
    document.getElementById("chat");


  const box =
    document.createElement("div");


  box.className =
    "message " +
    (
      message.sender === myId
        ? "mine"
        : "other"
    );


  box.textContent =
    message.message;


  chat.appendChild(box);

}


// ===============================
// KIRIM PESAN
// ===============================

async function sendMessage() {

  const input =
    document.getElementById("message");


  const text =
    input.value.trim();


  if (!text) return;


  input.value = "";


  const { error } =
    await supabaseClient
      .from("messages")
      .insert({

        sender: myId,

        message: text

      });


  if (error) {

    alert(
      "Pesan gagal dikirim:\n" +
      error.message
    );

    input.value = text;

  }

}


// ===============================
// REALTIME CHAT
// ===============================

function subscribeChat() {

  chatChannel =
    supabaseClient
      .channel("chat-room-" + myId)

      .on(
        "postgres_changes",
        {
          event: "INSERT",
          schema: "public",
          table: "messages"
        },
        payload => {

          displayMessage(
            payload.new
          );

          scrollBottom();

        }
      )

      .subscribe();

}


// ===============================
// SCROLL
// ===============================

function scrollBottom() {

  const chat =
    document.getElementById("chat");

  chat.scrollTop =
    chat.scrollHeight;

}


// ===============================
// VIDEO CALL
// ===============================

const rtcConfig = {

  iceServers: [

    {
      urls:
        "stun:stun.l.google.com:19302"
    }

  ]

};


// MULAI CALL
async function startCall() {

  try {

    localStream =
      await navigator.mediaDevices.getUserMedia({

        video: true,

        audio: true

      });


    document.getElementById(
      "localVideo"
    ).srcObject =
      localStream;


    document.getElementById(
      "callArea"
    ).style.display =
      "block";


    peerConnection =
      new RTCPeerConnection(
        rtcConfig
      );


    localStream
      .getTracks()
      .forEach(track => {

        peerConnection.addTrack(
          track,
          localStream
        );

      });


    peerConnection.ontrack =
      event => {

        document.getElementById(
          "remoteVideo"
        ).srcObject =
          event.streams[0];

      };


    peerConnection.onicecandidate =
      event => {

        if (!event.candidate)
          return;


        sendSignal({

          type: "candidate",

          candidate:
            event.candidate

        });

      };


    setupCallChannel();


    const offer =
      await peerConnection
        .createOffer();


    await peerConnection
      .setLocalDescription(
        offer
      );


    sendSignal({

      type: "offer",

      offer: offer

    });


  } catch (error) {

    alert(
      "Kamera/mikrofon tidak bisa digunakan:\n" +
      error.message
    );

  }

}


// CHANNEL VIDEO
function setupCallChannel() {

  if (callChannel)
    return;


  callChannel =
    supabaseClient
      .channel("video-call-room")

      .on(
        "broadcast",
        {
          event: "signal"
        },
        async ({ payload }) => {

          if (
            payload.sender === myId
          )
            return;


          await handleSignal(
            payload.signal
          );

        }
      )

      .subscribe();

}


// KIRIM SIGNAL
function sendSignal(signal) {

  if (!callChannel)
    setupCallChannel();


  if (!callChannel)
    return;


  callChannel.send({

    type: "broadcast",

    event: "signal",

    payload: {

      sender: myId,

      signal: signal

    }

  });

}


// TERIMA SIGNAL
async function handleSignal(signal) {

  if (
    signal.type === "offer"
  ) {

    if (!peerConnection) {

      await createAnswerConnection();

    }


    await peerConnection
      .setRemoteDescription(
        signal.offer
      );


    const answer =
      await peerConnection
        .createAnswer();


    await peerConnection
      .setLocalDescription(
        answer
      );


    sendSignal({

      type: "answer",

      answer: answer

    });

  }


  if (
    signal.type === "answer"
  ) {

    if (!peerConnection)
      return;


    await peerConnection
      .setRemoteDescription(
        signal.answer
      );

  }


  if (
    signal.type === "candidate"
  ) {

    if (!peerConnection)
      return;


    try {

      await peerConnection
        .addIceCandidate(
          signal.candidate
        );

    } catch (error) {

      console.error(error);

    }

  }

}


// BUAT CONNECTION PENERIMA
async function createAnswerConnection() {

  localStream =
    await navigator.mediaDevices
      .getUserMedia({

        video: true,

        audio: true

      });


  document.getElementById(
    "localVideo"
  ).srcObject =
    localStream;


  document.getElementById(
    "callArea"
  ).style.display =
    "block";


  peerConnection =
    new RTCPeerConnection(
      rtcConfig
    );


  localStream
    .getTracks()
    .forEach(track => {

      peerConnection.addTrack(
        track,
        localStream
      );

    });


  peerConnection.ontrack =
    event => {

      document.getElementById(
        "remoteVideo"
      ).srcObject =
        event.streams[0];

    };


  peerConnection.onicecandidate =
    event => {

      if (!event.candidate)
        return;


      sendSignal({

        type: "candidate",

        candidate:
          event.candidate

      });

    };


  setupCallChannel();

}


// MATIKAN MIC
function toggleMic() {

  if (!localStream)
    return;


  const audio =
    localStream
      .getAudioTracks()[0];


  if (audio)
    audio.enabled =
      !audio.enabled;

}


// MATIKAN KAMERA
function toggleCamera() {

  if (!localStream)
    return;


  const video =
    localStream
      .getVideoTracks()[0];


  if (video)
    video.enabled =
      !video.enabled;

}


// AKHIRI CALL
function endCall() {

  if (peerConnection) {

    peerConnection.close();

    peerConnection =
      null;

  }


  if (localStream) {

    localStream
      .getTracks()
      .forEach(track =>
        track.stop()
      );

    localStream =
      null;

  }


  if (callChannel) {

    supabaseClient
      .removeChannel(
        callChannel
      );

    callChannel =
      null;

  }


  document.getElementById(
    "localVideo"
  ).srcObject =
    null;


  document.getElementById(
    "remoteVideo"
  ).srcObject =
    null;


  document.getElementById(
    "callArea"
  ).style.display =
    "none";

}


// ===============================
// TOMBOL VIDEO CALL
// ===============================

const videoCallButton =
  document.createElement("button");


videoCallButton.textContent =
  "Video Call";


videoCallButton.style.position =
  "fixed";


videoCallButton.style.bottom =
  "70px";


videoCallButton.style.right =
  "15px";


videoCallButton.style.zIndex =
  "999";


videoCallButton.onclick =
  startCall;


document.body.appendChild(
  videoCallButton
);

</script>

</body>
</html>
