<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asisten Pribadi</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      height: 100vh;
    }

    .app {
      max-width: 700px;
      height: 100vh;
      margin: auto;
      background: white;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 16px;
      border-bottom: 1px solid #ddd;
      font-size: 20px;
      font-weight: bold;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .message {
      margin-bottom: 12px;
      padding: 10px 14px;
      border-radius: 12px;
      max-width: 85%;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .user {
      background: #e8f0fe;
      margin-left: auto;
    }

    .ai {
      background: #f0f0f0;
      margin-right: auto;
    }

    .input-area {
      display: flex;
      padding: 10px;
      border-top: 1px solid #ddd;
      gap: 8px;
    }

    input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 16px;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    Asisten Pribadi
  </div>

  <div id="chat">
    <div class="message ai">
      Halo. Saya siap membantu.
    </div>
  </div>

  <div class="input-area">
    <input
      id="message"
      type="text"
      placeholder="Tulis pesan..."
      onkeydown="if(event.key === 'Enter') sendMessage()"
    >

    <button onclick="sendMessage()">
      Kirim
    </button>
  </div>

</div>

<script>
  function sendMessage() {
    const input = document.getElementById("message");
    const chat = document.getElementById("chat");

    const text = input.value.trim();

    if (!text) return;

    const userMessage = document.createElement("div");
    userMessage.className = "message user";
    userMessage.textContent = text;

    chat.appendChild(userMessage);

    input.value = "";

    const aiMessage = document.createElement("div");
    aiMessage.className = "message ai";
    aiMessage.textContent =
      "Pesan diterima. AI dan database akan kita hubungkan setelah ini.";

    chat.appendChild(aiMessage);

    chat.scrollTop = chat.scrollHeight;
  }
</script>

</body>
</html>
