<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Chat Pribadi</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f2f2f2;
  height:100vh;
}
.app{
  max-width:700px;
  height:100vh;
  margin:auto;
  background:white;
  display:flex;
  flex-direction:column;
}
#accessPage{
  padding:30px 20px;
  margin:auto;
  width:100%;
  max-width:400px;
}
#accessPage h2{
  text-align:center;
  margin-bottom:25px;
}
input{
  padding:12px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:16px;
}
#accessPage input{
  width:100%;
  margin-bottom:10px;
}
button{
  padding:12px 18px;
  border:0;
  border-radius:10px;
  background:#111;
  color:white;
  font-size:16px;
  cursor:pointer;
}
#accessPage button{width:100%}
#status{
  text-align:center;
  margin-top:15px;
  font-size:14px;
}
#chatPage{
  display:none;
  flex-direction:column;
  height:100%;
}
.header{
  padding:15px;
  border-bottom:1px solid #ddd;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-weight:bold;
}
.header small{
  display:block;
  color:#777;
  font-weight:normal;
  margin-top:3px;
}
.header button{
  background:#d33;
  padding:7px 10px;
  font-size:12px;
}
#chat{
  flex:1;
  overflow-y:auto;
  padding:16px;
}
.message{
  margin-bottom:10px;
  padding:10px 14px;
  border-radius:14px;
  max-width:80%;
  line-height:1.4;
  word-wrap:break-word;
}
.mine{
  background:#111;
  color:white;
  margin-left:auto;
}
.other{
  background:#e9e9e9;
  color:#111;
  margin-right:auto;
}
.message img{
  display:block;
  max-width:100%;
  max-height:350px;
  border-radius:10px;
  cursor:pointer;
}
.message video{
  display:block;
  max-width:100%;
  max-height:350px;
  border-radius:10px;
}
.media-name{
  font-size:12px;
  margin-top:6px;
  opacity:.7;
}
.view-once{
  width:100%;
  background:#222;
}
.expired{
  opacity:.65;
  font-size:13px;
}
.input-area{
  display:flex;
  padding:10px;
  border-top:1px solid #ddd;
  gap:8px;
  align-items:center;
}
.input-area input[type=text]{
  flex:1;
  min-width:0;
}
.media-button{
  width:48px;
  height:46px;
  padding:0;
  font-size:22px;
  background:#eee;
  color:#111;
}
#fileInput{display:none}
#uploadStatus{
  display:none;
  padding:8px 12px;
  font-size:13px;
  color:#555;
  background:#f5f5f5;
}
.preview{
  display:none;
  padding:8px 10px;
  border-top:1px solid #ddd;
  background:#fafafa;
  font-size:13px;
}
.preview button{
  background:#d33;
  padding:5px 9px;
  margin-left:8px;
  font-size:12px;
}
#mediaMenu{
  display:none;
  position:fixed;
  bottom:70px;
  left:50%;
  transform:translateX(-50%);
  background:white;
  border:1px solid #ddd;
  border-radius:14px;
  padding:10px;
  box-shadow:0 5px 20px rgba(0,0,0,.2);
  z-index:5000;
  width:240px;
}
#mediaMenu button{
  width:100%;
  margin-bottom:7px;
}
#mediaMenu button:last-child{
  margin-bottom:0;
}
#viewer{
  display:none;
  position:fixed;
  inset:0;
  background:#000;
  z-index:9999;
  align-items:center;
  justify-content:center;
}
#viewer img{
  max-width:100%;
  max-height:100%;
  object-fit:contain;
}
#closeViewer{
  position:absolute;
  top:15px;
  right:15px;
  width:45px;
  height:45px;
  border-radius:50%;
  background:#d33;
  font-size:22px;
  padding:0;
}
</style>
</head>

<body>

<div class="app">

<div id="accessPage">
<h2>Chat Pribadi</h2>

<input
 id="pin"
 type="password"
 placeholder="Kode ruang"
 maxlength="30"
 onkeydown="if(event.key==='Enter')enterChat()"
>

<button onclick="enterChat()">Masuk</button>

<div id="status"></div>
</div>


<div id="chatPage">

<div class="header">
<div>
Chat Pribadi
<small>Ruang privat</small>
</div>

<button onclick="leaveChat()">Keluar</button>
</div>

<div id="chat"></div>

<div id="uploadStatus"></div>

<div id="preview">
<span id="previewName"></span>
<button onclick="cancelFile()">Batal</button>
</div>

<div class="input-area">

<input
 id="message"
 type="text"
 placeholder="Tulis pesan..."
 maxlength="2000"
 onkeydown="if(event.key==='Enter')sendMessage()"
>

<input
 id="fileInput"
 type="file"
 accept="image/*,video/*"
 onchange="selectFile(event)"
>

<button
 class="media-button"
 onclick="openMediaMenu()"
>
📎
</button>

<button onclick="sendMessage()">Kirim</button>

</div>

</div>
</div>


<div id="mediaMenu">

<button onclick="chooseMedia(false)">
🖼️ Kirim gambar / video
</button>

<button onclick="chooseMedia(true)">
👁️ Gambar sekali lihat
</button>

</div>


<div id="viewer">

<button id="closeViewer" onclick="closeViewer()">×</button>

<img id="viewerImage">

</div>


<script>

const SUPABASE_URL =
"https://aymsvwvtyalewphcvvfb.supabase.co";

const SUPABASE_KEY =
"sb_publishable_cAkNxO3QBbR2HaKLJPV6BQ_Zme9TIhz";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

const CHAT_PIN="4827";

const BUCKET="chat-media";

const FUNCTION_URL =
SUPABASE_URL +
"/functions/v1/view-once";

let myId="";

let chatChannel=null;

let selectedFile=null;

let selectedViewOnce=false;


/* =========================
   MASUK
========================= */

function enterChat(){

const pin=
document.getElementById("pin").value.trim();

const status=
document.getElementById("status");

if(!pin){

status.textContent=
"Masukkan kode ruang.";

return;
}

if(pin!==CHAT_PIN){

status.textContent=
"Kode ruang salah.";

return;
}

myId=
localStorage.getItem("chat_user_id");

if(!myId){

myId=
crypto.randomUUID();

localStorage.setItem(
"chat_user_id",
myId
);

}

document.getElementById(
"accessPage"
).style.display="none";

document.getElementById(
"chatPage"
).style.display="flex";

loadMessages();

subscribeChat();

}


/* =========================
   KELUAR
========================= */

function leaveChat(){

if(chatChannel){

supabaseClient.removeChannel(
chatChannel
);

chatChannel=null;

}

cancelFile();

document.getElementById(
"chatPage"
).style.display="none";

document.getElementById(
"accessPage"
).style.display="block";

document.getElementById(
"pin"
).value="";

document.getElementById(
"chat"
).innerHTML="";

}


/* =========================
   LOAD
========================= */

async function loadMessages(){

const chat=
document.getElementById("chat");

chat.innerHTML="";

const {data,error}=
await supabaseClient
.from("messages")
.select("*")
.order("created_at",{
ascending:true
});

if(error){

chat.textContent=
"Gagal mengambil pesan: "+
error.message;

return;
}

for(const message of data){

displayMessage(message);

}

scrollBottom();

}


/* =========================
   DISPLAY
========================= */

function displayMessage(message){

const chat=
document.getElementById("chat");

const box=
document.createElement("div");

box.className=
"message "+
(
message.sender===myId
?"mine"
:"other"
);

let media=null;

try{

const parsed=
JSON.parse(message.message);

if(
parsed &&
parsed.type==="media"
){

media=parsed;

}

}catch(e){}


/* =====================
   MEDIA
===================== */

if(media){

if(media.viewOnce===true){

const viewed=
Array.isArray(media.viewedBy) &&
media.viewedBy.includes(myId);

if(
viewed &&
message.sender!==myId
){

const expired=
document.createElement("div");

expired.className="expired";

expired.textContent=
"👁️ Gambar sekali lihat sudah dibuka";

box.appendChild(expired);

}else{

const button=
document.createElement("button");

button.className="view-once";

button.textContent=
"👁️ Lihat gambar sekali";

button.onclick=
()=>openViewOnce(
message,
media
);

box.appendChild(button);

}

}else{

if(media.mediaType==="image"){

const img=
document.createElement("img");

img.src=
media.url;

img.onclick=
()=>openNormalImage(media.url);

box.appendChild(img);

}

if(media.mediaType==="video"){

const video=
document.createElement("video");

video.src=
media.url;

video.controls=true;

video.playsInline=true;

box.appendChild(video);

}

}

const name=
document.createElement("div");

name.className="media-name";

name.textContent=
media.viewOnce
?"👁️ Sekali lihat"
:media.name;

box.appendChild(name);

}else{

box.textContent=
message.message;

}

chat.appendChild(box);

}


/* =========================
   KIRIM PESAN
========================= */

async function sendMessage(){

if(selectedFile){

await uploadMedia();

return;

}

const input=
document.getElementById("message");

const text=
input.value.trim();

if(!text)return;

input.value="";

const {error}=
await supabaseClient
.from("messages")
.insert({
sender:myId,
message:text
});

if(error){

alert(
"Pesan gagal dikirim:\n"+
error.message
);

input.value=text;

}

}


/* =========================
   MEDIA MENU
========================= */

function openMediaMenu(){

const menu=
document.getElementById(
"mediaMenu"
);

menu.style.display=
menu.style.display==="block"
?"none"
:"block";

}


function chooseMedia(viewOnce){

selectedViewOnce=
viewOnce;

document.getElementById(
"mediaMenu"
).style.display="none";

const input=
document.getElementById(
"fileInput"
);

input.accept=
viewOnce
?"image/*"
:"image/*,video/*";

input.value="";

input.click();

}


/* =========================
   FILE
========================= */

function selectFile(event){

const file=
event.target.files[0];

if(!file)return;

const max=
50*1024*1024;

if(file.size>max){

alert(
"Ukuran maksimal 50 MB."
);

event.target.value="";

return;

}

if(
!file.type.startsWith("image/") &&
!file.type.startsWith("video/")
){

alert(
"Hanya gambar dan video."
);

event.target.value="";

return;

}

if(
selectedViewOnce &&
!file.type.startsWith("image/")
){

alert(
"Sekali lihat hanya untuk gambar."
);

event.target.value="";

return;

}

selectedFile=file;

document.getElementById(
"previewName"
).textContent=
selectedViewOnce
?"👁️ "+file.name+" — Sekali lihat"
:file.name;

document.getElementById(
"preview"
).style.display="block";

}


/* =========================
   CANCEL
========================= */

function cancelFile(){

selectedFile=null;

selectedViewOnce=false;

document.getElementById(
"fileInput"
).value="";

document.getElementById(
"preview"
).style.display="none";

document.getElementById(
"previewName"
).textContent="";

}


/* =========================
   UPLOAD
========================= */

async function uploadMedia(){

if(!selectedFile)return;

const file=
selectedFile;

const status=
document.getElementById(
"uploadStatus"
);

status.style.display="block";

status.textContent=
"Mengunggah...";

try{

const ext=
file.name.includes(".")
?file.name.split(".").pop()
:"jpg";

const path=
myId+
"/"+
crypto.randomUUID()+
"."+ext;


/*
   UPLOAD PRIVATE
*/

const {error:uploadError}=
await supabaseClient
.storage
.from(BUCKET)
.upload(
path,
file,
{
upsert:false,
contentType:file.type
}
);

if(uploadError)
throw uploadError;


/*
   MEDIA BIASA
*/

if(!selectedViewOnce){

const {data:signed,error}=
await supabaseClient
.storage
.from(BUCKET)
.createSignedUrl(
path,
60*60*24*30
);

if(error)
throw error;

const media={
type:"media",
mediaType:
file.type.startsWith("image/")
?"image"
:"video",
url:signed.signedUrl,
path:path,
name:file.name,
viewOnce:false
};

await saveMedia(media);

}

/*
   VIEW ONCE
*/

else{

const token=
crypto.randomUUID();

const media={
type:"media",
mediaType:"image",
path:path,
name:file.name,
token:token,
viewOnce:true,
viewedBy:[]
};

await saveMedia(media);

}

cancelFile();

status.style.display="none";

}catch(error){

console.error(error);

alert(
"Upload gagal:\n"+
error.message
);

status.style.display="none";

}

}


/* =========================
   SAVE MEDIA
========================= */

async function saveMedia(media){

const {error}=
await supabaseClient
.from("messages")
.insert({

sender:myId,

message:
JSON.stringify(media)

});

if(error)
throw error;

}


/* =========================
   VIEW ONCE
========================= */

async function openViewOnce(
message,
media
){

if(message.sender===myId){

alert(
"Pengirim tidak perlu membuka gambar melalui View Once."
);

return;

}

const viewed=
Array.isArray(media.viewedBy) &&
media.viewedBy.includes(myId);

if(viewed){

alert(
"Gambar sudah dibuka."
);

return;

}

const url=
FUNCTION_URL+
"?message="+
encodeURIComponent(message.id)+
"&token="+
encodeURIComponent(media.token)+
"&viewer="+
encodeURIComponent(myId);

try{

const response=
await fetch(url,{
method:"GET",
cache:"no-store"
});

if(!response.ok){

const text=
await response.text();

throw new Error(
text ||
"Gambar sudah tidak tersedia."
);

}

const blob=
await response.blob();

const imageUrl=
URL.createObjectURL(blob);


/*
   Tampilkan gambar.
*/

const viewer=
document.getElementById(
"viewer"
);

const img=
document.getElementById(
"viewerImage"
);

img.src=imageUrl;

viewer.style.display="flex";


/*
   Bersihkan URL blob setelah
   viewer ditutup.
*/

img.dataset.blobUrl=
imageUrl;


/*
   Refresh chat agar tombol berubah
   menjadi "sudah dibuka".
*/

setTimeout(
refreshChat,
500
);

}catch(error){

console.error(error);

alert(
"Gambar tidak dapat dibuka:\n"+
error.message
);

}

}


/* =========================
   GAMBAR BIASA
========================= */

function openNormalImage(url){

const viewer=
document.getElementById(
"viewer"
);

const img=
document.getElementById(
"viewerImage"
);

img.src=url;

viewer.style.display="flex";

}


/* =========================
   CLOSE VIEWER
========================= */

function closeViewer(){

const viewer=
document.getElementById(
"viewer"
);

const img=
document.getElementById(
"viewerImage"
);

const blobUrl=
img.dataset.blobUrl;

if(blobUrl){

URL.revokeObjectURL(
blobUrl
);

img.dataset.blobUrl="";

}

img.src="";

viewer.style.display="none";

}


/* =========================
   REALTIME
========================= */

function subscribeChat(){

if(chatChannel){

supabaseClient.removeChannel(
chatChannel
);

}

chatChannel=
supabaseClient
.channel("chat-room-global")

.on(
"postgres_changes",
{
event:"INSERT",
schema:"public",
table:"messages"
},
payload=>{

displayMessage(
payload.new
);

scrollBottom();

}
)

.on(
"postgres_changes",
{
event:"UPDATE",
schema:"public",
table:"messages"
},
payload=>{

refreshChat();

}
)

.subscribe();

}


/* =========================
   REFRESH
========================= */

async function refreshChat(){

const chat=
document.getElementById("chat");

chat.innerHTML="";

const {data,error}=
await supabaseClient
.from("messages")
.select("*")
.order("created_at",{
ascending:true
});

if(error)return;

for(const message of data){

displayMessage(message);

}

scrollBottom();

}


/* =========================
   SCROLL
========================= */

function scrollBottom(){

const chat=
document.getElementById(
"chat"
);

chat.scrollTop=
chat.scrollHeight;

}

</script>

</body>
</html>
