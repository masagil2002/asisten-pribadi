<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Pribadi</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      height: 100vh;
    }

    .app {
      max-width: 700px;
      height: 100vh;
      margin: auto;
      background: white;
      display: flex;
      flex-direction: column;
    }

    #accessPage {
      padding: 30px 20px;
      margin: auto;
      width: 100%;
      max-width: 400px;
    }

    #accessPage h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    input {
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    #accessPage input {
      width: 100%;
      margin-bottom: 10px;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #accessPage button {
      width: 100%;
    }

    #status {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }

    #chatPage {
      display: none;
      flex-direction: column;
      height: 100%;
    }

    .header {
      padding: 15px;
      border-bottom: 1px solid #ddd;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
    }

    .header small {
      display: block;
      color: #777;
      font-weight: normal;
      margin-top: 3px;
    }

    .header button {
      background: #d33;
      padding: 7px 10px;
      font-size: 12px;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .message {
      margin-bottom: 10px;
      padding: 10px 14px;
      border-radius: 14px;
      max-width: 80%;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .mine {
      background: #111;
      color: white;
      margin-left: auto;
    }

    .other {
      background: #e9e9e9;
      color: #111;
      margin-right: auto;
    }

    .message img {
      display: block;
      max-width: 100%;
      max-height: 350px;
      border-radius: 10px;
      cursor: pointer;
    }

    .message video {
      display: block;
      max-width: 100%;
      max-height: 350px;
      border-radius: 10px;
    }

    .media-name {
      font-size: 12px;
      margin-top: 6px;
      opacity: 0.7;
    }

    .view-once-button {
      width: 100%;
      background: #222;
    }

    .expired {
      opacity: 0.65;
      font-size: 13px;
    }

    .input-area {
      display: flex;
      padding: 10px;
      border-top: 1px solid #ddd;
      gap: 8px;
      align-items: center;
    }

    .input-area input[type="text"] {
      flex: 1;
      min-width: 0;
    }

    .media-button {
      width: 48px;
      height: 46px;
      padding: 0;
      font-size: 22px;
      background: #eee;
      color: #111;
      flex-shrink: 0;
    }

    .send-button {
      flex-shrink: 0;
    }

    #fileInput {
      display: none;
    }

    #uploadStatus {
      display: none;
      padding: 8px 12px;
      font-size: 13px;
      color: #555;
      background: #f5f5f5;
      border-top: 1px solid #ddd;
    }

    .preview {
      display: none;
      padding: 8px 10px;
      border-top: 1px solid #ddd;
      background: #fafafa;
      font-size: 13px;
    }

    .preview button {
      background: #d33;
      padding: 5px 9px;
      margin-left: 8px;
      font-size: 12px;
    }

    #mediaMenu {
      display: none;
      position: fixed;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      background: white;
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: 10px;
      box-shadow: 0 5px 20px rgba(0,0,0,.2);
      z-index: 5000;
      width: 240px;
    }

    #mediaMenu button {
      width: 100%;
      margin-bottom: 7px;
    }

    #mediaMenu button:last-child {
      margin-bottom: 0;
    }

    .fullscreen-media {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.94);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .fullscreen-media img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 5px;
    }

    .close-media {
      position: absolute;
      top: 15px;
      right: 15px;
      background: #d33;
      font-size: 20px;
      width: 45px;
      height: 45px;
      padding: 0;
      border-radius: 50%;
      z-index: 2;
    }

    .view-once-label {
      font-size: 13px;
      margin-top: 6px;
      opacity: .8;
    }
  </style>
</head>

<body>

<div class="app">

  <!-- ========================= -->
  <!-- HALAMAN MASUK -->
  <!-- ========================= -->

  <div id="accessPage">

    <h2>Chat Pribadi</h2>

    <input
      id="pin"
      type="password"
      placeholder="Kode ruang"
      maxlength="30"
      onkeydown="if(event.key === 'Enter') enterChat()"
    >

    <button onclick="enterChat()">
      Masuk
    </button>

    <div id="status"></div>

  </div>


  <!-- ========================= -->
  <!-- HALAMAN CHAT -->
  <!-- ========================= -->

  <div id="chatPage">

    <div class="header">

      <div>
        Chat Pribadi
        <small>Ruang privat</small>
      </div>

      <button onclick="leaveChat()">
        Keluar
      </button>

    </div>


    <div id="chat"></div>


    <div id="uploadStatus">
      Mengunggah...
    </div>


    <div
      id="preview"
      class="preview"
    >

      <span id="previewName"></span>

      <button onclick="cancelFile()">
        Batal
      </button>

    </div>


    <div class="input-area">

      <input
        id="message"
        type="text"
        placeholder="Tulis pesan..."
        maxlength="2000"
        onkeydown="if(event.key === 'Enter') sendMessage()"
      >


      <input
        id="fileInput"
        type="file"
        accept="image/*,video/*"
        onchange="selectFile(event)"
      >


      <button
        class="media-button"
        onclick="openMediaMenu()"
        title="Kirim media"
      >
        📎
      </button>


      <button
        class="send-button"
        onclick="sendMessage()"
      >
        Kirim
      </button>

    </div>

  </div>

</div>


<!-- ========================= -->
<!-- MENU MEDIA -->
<!-- ========================= -->

<div id="mediaMenu">

  <button onclick="chooseMedia(false)">
    🖼️ Kirim gambar / video
  </button>

  <button onclick="chooseMedia(true)">
    👁️ Gambar sekali lihat
  </button>

</div>


<!-- ========================= -->
<!-- FULLSCREEN -->
<!-- ========================= -->

<div
  id="fullscreenMedia"
  class="fullscreen-media"
  onclick="closeFullscreen(event)"
>

  <button
    class="close-media"
    onclick="closeFullscreen()"
  >
    ×
  </button>

  <div id="fullscreenContent"></div>

</div>


<script>

/* =====================================
   SUPABASE
===================================== */

const SUPABASE_URL =
  "https://aymsvwvtyalewphcvvfb.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_cAkNxO3QBbR2HaKLJPV6BQ_Zme9TIhz";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================
   PENGATURAN
===================================== */

const CHAT_PIN =
  "4827";

const STORAGE_BUCKET =
  "chat-media";

let myId =
  "";

let chatChannel =
  null;

let selectedFile =
  null;

let selectedViewOnce =
  false;


/* =====================================
   MASUK
===================================== */

function enterChat() {

  const pin =
    document.getElementById("pin")
      .value
      .trim();

  const status =
    document.getElementById("status");


  if (!pin) {

    status.textContent =
      "Masukkan kode ruang.";

    return;

  }


  if (pin !== CHAT_PIN) {

    status.textContent =
      "Kode ruang salah.";

    return;

  }


  myId =
    localStorage.getItem(
      "chat_user_id"
    );


  if (!myId) {

    myId =
      crypto.randomUUID();

    localStorage.setItem(
      "chat_user_id",
      myId
    );

  }


  document.getElementById(
    "accessPage"
  ).style.display =
    "none";


  document.getElementById(
    "chatPage"
  ).style.display =
    "flex";


  loadMessages();

  subscribeChat();

}


/* =====================================
   KELUAR
===================================== */

function leaveChat() {

  if (chatChannel) {

    supabaseClient.removeChannel(
      chatChannel
    );

    chatChannel =
      null;

  }


  cancelFile();


  myId =
    "";


  document.getElementById(
    "chatPage"
  ).style.display =
    "none";


  document.getElementById(
    "accessPage"
  ).style.display =
    "block";


  document.getElementById(
    "pin"
  ).value =
    "";


  document.getElementById(
    "chat"
  ).innerHTML =
    "";

}


/* =====================================
   LOAD PESAN
===================================== */

async function loadMessages() {

  const chat =
    document.getElementById(
      "chat"
    );


  chat.innerHTML =
    "";


  const {
    data,
    error
  } =
    await supabaseClient
      .from("messages")
      .select("*")
      .order(
        "created_at",
        {
          ascending: true
        }
      );


  if (error) {

    chat.innerHTML =
      "Gagal mengambil pesan: " +
      error.message;

    return;

  }


  for (
    const message of data
  ) {

    await displayMessage(
      message
    );

  }


  scrollBottom();

}


/* =====================================
   TAMPILKAN PESAN
===================================== */

async function displayMessage(
  message
) {

  const chat =
    document.getElementById(
      "chat"
    );


  const box =
    document.createElement(
      "div"
    );


  box.className =
    "message " +
    (
      message.sender === myId
        ? "mine"
        : "other"
    );


  let mediaData =
    null;


  try {

    const parsed =
      JSON.parse(
        message.message
      );


    if (
      parsed &&
      parsed.type === "media" &&
      parsed.url
    ) {

      mediaData =
        parsed;

    }

  } catch (error) {

    mediaData =
      null;

  }


  /* =================================
     MEDIA
  ================================= */

  if (mediaData) {

    /* ===============================
       SEKALI LIHAT
    =============================== */

    if (
      mediaData.viewOnce === true
    ) {

      const viewedBy =
        Array.isArray(
          mediaData.viewedBy
        )
          ? mediaData.viewedBy
          : [];


      const alreadyViewed =
        viewedBy.includes(
          myId
        );


      /*
        Pengirim tetap bisa melihat
        pesan yang dia kirim.
      */

      if (
        alreadyViewed &&
        message.sender !== myId
      ) {

        const expired =
          document.createElement(
            "div"
          );


        expired.className =
          "expired";


        expired.textContent =
          "👁️ Gambar sekali lihat sudah dibuka";


        box.appendChild(
          expired
        );

      }

      else {

        const button =
          document.createElement(
            "button"
          );


        button.className =
          "view-once-button";


        button.textContent =
          "👁️ Lihat gambar sekali";


        button.onclick =
          () => openViewOnce(
            message,
            mediaData
          );


        box.appendChild(
          button
        );


        const label =
          document.createElement(
            "div"
          );


        label.className =
          "view-once-label";


        label.textContent =
          "Gambar sekali lihat";


        box.appendChild(
          label
        );

      }

    }


    /* ===============================
       MEDIA BIASA
    =============================== */

    else {

      if (
        mediaData.mediaType ===
        "image"
      ) {

        const img =
          document.createElement(
            "img"
          );


        img.src =
          mediaData.url;


        img.alt =
          mediaData.name ||
          "Gambar";


        img.onclick =
          () => openImage(
            mediaData.url
          );


        box.appendChild(
          img
        );

      }


      if (
        mediaData.mediaType ===
        "video"
      ) {

        const video =
          document.createElement(
            "video"
          );


        video.src =
          mediaData.url;


        video.controls =
          true;


        video.playsInline =
          true;


        box.appendChild(
          video
        );

      }

    }


    if (
      mediaData.name
    ) {

      const name =
        document.createElement(
          "div"
        );


      name.className =
        "media-name";


      name.textContent =
        mediaData.viewOnce
          ? "👁️ Sekali lihat"
          : mediaData.name;


      box.appendChild(
        name
      );

    }

  }

  /* =================================
     PESAN TEKS
  ================================= */

  else {

    box.textContent =
      message.message;

  }


  chat.appendChild(
    box
  );

}


/* =====================================
   KIRIM PESAN
===================================== */

async function sendMessage() {

  if (
    selectedFile
  ) {

    await uploadMedia();

    return;

  }


  const input =
    document.getElementById(
      "message"
    );


  const text =
    input.value.trim();


  if (!text)
    return;


  input.value =
    "";


  const {
    error
  } =
    await supabaseClient
      .from("messages")
      .insert({

        sender:
          myId,

        message:
          text

      });


  if (error) {

    alert(
      "Pesan gagal dikirim:\n" +
      error.message
    );


    input.value =
      text;

  }

}


/* =====================================
   MENU MEDIA
===================================== */

function openMediaMenu() {

  const menu =
    document.getElementById(
      "mediaMenu"
    );


  menu.style.display =
    menu.style.display === "block"
      ? "none"
      : "block";

}


function chooseMedia(
  viewOnce
) {

  selectedViewOnce =
    viewOnce;


  document.getElementById(
    "mediaMenu"
  ).style.display =
    "none";


  const input =
    document.getElementById(
      "fileInput"
    );


  if (
    viewOnce
  ) {

    input.accept =
      "image/*";

  }

  else {

    input.accept =
      "image/*,video/*";

  }


  input.value =
    "";


  input.click();

}


/* =====================================
   PILIH FILE
===================================== */

function selectFile(
  event
) {

  const file =
    event.target.files[0];


  if (!file)
    return;


  const maxSize =
    50 *
    1024 *
    1024;


  if (
    file.size >
    maxSize
  ) {

    alert(
      "Ukuran file maksimal 50 MB."
    );


    event.target.value =
      "";


    return;

  }


  if (
    !file.type.startsWith(
      "image/"
    ) &&
    !file.type.startsWith(
      "video/"
    )
  ) {

    alert(
      "Hanya gambar dan video yang diperbolehkan."
    );


    event.target.value =
      "";


    return;

  }


  if (
    selectedViewOnce &&
    !file.type.startsWith(
      "image/"
    )
  ) {

    alert(
      "Sekali lihat hanya bisa digunakan untuk gambar."
    );


    event.target.value =
      "";


    return;

  }


  selectedFile =
    file;


  document.getElementById(
    "previewName"
  ).textContent =
    selectedViewOnce
      ? "👁️ " +
        file.name +
        " — Sekali lihat"
      : file.name;


  document.getElementById(
    "preview"
  ).style.display =
    "block";

}


/* =====================================
   BATAL FILE
===================================== */

function cancelFile() {

  selectedFile =
    null;


  selectedViewOnce =
    false;


  document.getElementById(
    "fileInput"
  ).value =
    "";


  document.getElementById(
    "preview"
  ).style.display =
    "none";


  document.getElementById(
    "previewName"
  ).textContent =
    "";

}


/* =====================================
   UPLOAD MEDIA
===================================== */

async function uploadMedia() {

  if (!selectedFile)
    return;


  const file =
    selectedFile;


  const uploadStatus =
    document.getElementById(
      "uploadStatus"
    );


  uploadStatus.style.display =
    "block";


  uploadStatus.textContent =
    "Mengunggah " +
    file.name +
    "...";


  try {

    const extension =
      file.name.includes(".")
        ? file.name
            .split(".")
            .pop()
        : "file";


    const filePath =
      myId +
      "/" +
      crypto.randomUUID() +
      "." +
      extension;


    const {
      error:
        uploadError
    } =
      await supabaseClient
        .storage
        .from(
          STORAGE_BUCKET
        )
        .upload(
          filePath,
          file,
          {
            cacheControl:
              "3600",

            upsert:
              false,

            contentType:
              file.type
          }
        );


    if (
      uploadError
    ) {

      throw uploadError;

    }


    const {
      data:
        urlData
    } =
      supabaseClient
        .storage
        .from(
          STORAGE_BUCKET
        )
        .getPublicUrl(
          filePath
        );


    const publicUrl =
      urlData.publicUrl;


    const mediaType =
      file.type.startsWith(
        "image/"
      )
        ? "image"
        : "video";


    const mediaMessage =
      JSON.stringify({

        type:
          "media",

        mediaType:
          mediaType,

        url:
          publicUrl,

        name:
          file.name,

        viewOnce:
          selectedViewOnce,

        viewedBy:
          []

      });


    const {
      error:
        messageError
    } =
      await supabaseClient
        .from(
          "messages"
        )
        .insert({

          sender:
            myId,

          message:
            mediaMessage

        });


    if (
      messageError
    ) {

      throw messageError;

    }


    cancelFile();


    uploadStatus.style.display =
      "none";


  } catch (
    error
  ) {

    console.error(
      error
    );


    alert(
      "File gagal dikirim:\n" +
      error.message
    );


    uploadStatus.style.display =
      "none";

  }

}


/* =====================================
   REALTIME CHAT
===================================== */

function subscribeChat() {

  if (
    chatChannel
  ) {

    supabaseClient.removeChannel(
      chatChannel
    );

  }


  chatChannel =
    supabaseClient
      .channel(
        "chat-room-global"
      )

      .on(
        "postgres_changes",
        {
          event:
            "INSERT",

          schema:
            "public",

          table:
            "messages"
        },

        async payload => {

          await displayMessage(
            payload.new
          );


          scrollBottom();

        }

      )

      .on(
        "postgres_changes",
        {
          event:
            "UPDATE",

          schema:
            "public",

          table:
            "messages"
        },

        async payload => {

          /*
            Update diperlukan supaya
            status sekali lihat berubah
            setelah dibuka.
          */

          await refreshChat();

        }

      )

      .subscribe();

}


/* =====================================
   REFRESH CHAT
===================================== */

async function refreshChat() {

  const chat =
    document.getElementById(
      "chat"
    );


  chat.innerHTML =
    "";


  const {
    data,
    error
  } =
    await supabaseClient
      .from(
        "messages"
      )
      .select("*")
      .order(
        "created_at",
        {
          ascending:
            true
        }
      );


  if (
    error
  ) {

    console.error(
      error
    );

    return;

  }


  for (
    const message of data
  ) {

    await displayMessage(
      message
    );

  }


  scrollBottom();

}


/* =====================================
   VIEW ONCE
===================================== */

async function openViewOnce(
  message,
  mediaData
) {

  if (
    message.sender ===
    myId
  ) {

    openImage(
      mediaData.url
    );

    return;

  }


  const viewedBy =
    Array.isArray(
      mediaData.viewedBy
    )
      ? mediaData.viewedBy
      : [];


  if (
    viewedBy.includes(
      myId
    )
  ) {

    alert(
      "Gambar sekali lihat sudah dibuka."
    );


    return;

  }


  /*
    Tandai SEBELUM membuka.
    Ini mencegah klik berulang
    secara cepat.
  */

  const updatedMedia = {

    ...mediaData,

    viewedBy: [
      ...viewedBy,
      myId
    ]

  };


  const {
    error
  } =
    await supabaseClient
      .from(
        "messages"
      )
      .update({

        message:
          JSON.stringify(
            updatedMedia
          )

      })
      .eq(
        "id",
        message.id
      );


  if (
    error
  ) {

    alert(
      "Gambar tidak bisa dibuka."
    );


    console.error(
      error
    );


    return;

  }


  openImage(
    mediaData.url
  );


  setTimeout(
    () => {

      refreshChat();

    },
    500
  );

}


/* =====================================
   BUKA GAMBAR
===================================== */

function openImage(
  url
) {

  const container =
    document.getElementById(
      "fullscreenContent"
    );


  container.innerHTML =
    "";


  const img =
    document.createElement(
      "img"
    );


  img.src =
    url;


  container.appendChild(
    img
  );


  document.getElementById(
    "fullscreenMedia"
  ).style.display =
    "flex";

}


/* =====================================
   TUTUP FULLSCREEN
===================================== */

function closeFullscreen(
  event
) {

  if (
    event &&
    event.target !==
      event.currentTarget
  ) {

    return;

  }


  document.getElementById(
    "fullscreenMedia"
  ).style.display =
    "none";


  document.getElementById(
    "fullscreenContent"
  ).innerHTML =
    "";

}


/* =====================================
   SCROLL
===================================== */

function scrollBottom() {

  const chat =
    document.getElementById(
      "chat"
    );


  chat.scrollTop =
    chat.scrollHeight;

}

</script>

</body>
</html>
