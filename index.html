<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asisten Pribadi</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      height: 100vh;
    }

    .app {
      max-width: 700px;
      height: 100vh;
      margin: auto;
      background: white;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 16px;
      border-bottom: 1px solid #ddd;
      font-size: 20px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #loginPage {
      padding: 30px 20px;
    }

    #loginPage h2 {
      text-align: center;
    }

    #loginPage input {
      width: 100%;
      margin-bottom: 10px;
    }

    #loginPage button {
      width: 100%;
      margin-top: 5px;
    }

    #status {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }

    #chatPage {
      display: none;
      flex-direction: column;
      height: 100%;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .message {
      margin-bottom: 12px;
      padding: 10px 14px;
      border-radius: 12px;
      max-width: 85%;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .user {
      background: #e8f0fe;
      margin-left: auto;
    }

    .ai {
      background: #f0f0f0;
      margin-right: auto;
    }

    .input-area {
      display: flex;
      padding: 10px;
      border-top: 1px solid #ddd;
      gap: 8px;
    }

    input {
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    .input-area input {
      flex: 1;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .logout {
      padding: 8px 12px;
      font-size: 13px;
      background: #d33;
    }
  </style>
</head>

<body>

<div class="app">

  <!-- HALAMAN LOGIN -->
  <div id="loginPage">

    <h2>Asisten Pribadi</h2>

    <input
      id="email"
      type="email"
      placeholder="Email"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
    >

    <button onclick="login()">
      Login
    </button>

    <button onclick="register()" style="background:#555;">
      Daftar
    </button>

    <div id="status"></div>

  </div>


  <!-- HALAMAN CHAT -->
  <div id="chatPage">

    <div class="header">
      <span>Asisten Pribadi</span>
      <button class="logout" onclick="logout()">Logout</button>
    </div>

    <div id="chat">
      <div class="message ai">
        Halo. Saya siap membantu.
      </div>
    </div>

    <div class="input-area">

      <input
        id="message"
        type="text"
        placeholder="Tulis pesan..."
        onkeydown="if(event.key === 'Enter') sendMessage()"
      >

      <button onclick="sendMessage()">
        Kirim
      </button>

    </div>

  </div>

</div>


<script>

  // =========================
  // SUPABASE
  // =========================

  const SUPABASE_URL =
    "https://rmiubqnfefxfnlkvyaii.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_jr5tdJkneltTbwZVv5oTyg_3kzY1Nb5";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // =========================
  // REGISTER
  // =========================

  async function register() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const status =
      document.getElementById("status");

    if (!email || !password) {
      status.textContent =
        "Email dan password wajib diisi.";
      return;
    }

    if (password.length < 6) {
      status.textContent =
        "Password minimal 6 karakter.";
      return;
    }

    status.textContent =
      "Mendaftarkan akun...";

    const { data, error } =
      await supabaseClient.auth.signUp({
        email: email,
        password: password
      });

    if (error) {
      status.textContent =
        error.message;
      return;
    }

    status.textContent =
      "Pendaftaran berhasil. Silakan login.";

  }


  // =========================
  // LOGIN
  // =========================

  async function login() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const status =
      document.getElementById("status");

    if (!email || !password) {
      status.textContent =
        "Email dan password wajib diisi.";
      return;
    }

    status.textContent =
      "Login...";

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {
      status.textContent =
        error.message;
      return;
    }

    showChat();

  }


  // =========================
  // LOGOUT
  // =========================

  async function logout() {

    await supabaseClient.auth.signOut();

    document.getElementById("chatPage").style.display =
      "none";

    document.getElementById("loginPage").style.display =
      "block";

  }


  // =========================
  // TAMPILKAN CHAT
  // =========================

  function showChat() {

    document.getElementById("loginPage").style.display =
      "none";

    document.getElementById("chatPage").style.display =
      "flex";

  }


  // =========================
  // CEK LOGIN SAAT WEB DIBUKA
  // =========================

  async function checkUser() {

    const { data } =
      await supabaseClient.auth.getSession();

    if (data.session) {
      showChat();
    }

  }


  // =========================
  // CHAT SEMENTARA
  // =========================

  function sendMessage() {

    const input =
      document.getElementById("message");

    const chat =
      document.getElementById("chat");

    const text =
      input.value.trim();

    if (!text) return;

    const userMessage =
      document.createElement("div");

    userMessage.className =
      "message user";

    userMessage.textContent =
      text;

    chat.appendChild(userMessage);

    input.value = "";

    const aiMessage =
      document.createElement("div");

    aiMessage.className =
      "message ai";

    aiMessage.textContent =
      "Pesan diterima. Selanjutnya kita hubungkan AI dan memory Supabase.";

    chat.appendChild(aiMessage);

    chat.scrollTop =
      chat.scrollHeight;

  }


  checkUser();

</script>

</body>
</html>
